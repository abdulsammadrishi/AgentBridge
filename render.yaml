services:
  - type: web
    name: agentbridge-demo
    runtime: node
    plan: free
    buildCommand: npm run check
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DEMO_RESET_ENABLED
        value: "false"
      - key: AUTO_SEED_DEMO
        value: "true"
      - key: WEBMCP_ORIGIN_TRIAL_TOKEN
        sync: false
